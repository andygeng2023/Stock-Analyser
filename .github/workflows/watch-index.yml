name: WatchIndex shared watchlist refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/watch-index.yml"
      - "app/watch_indexer.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: stock-watch-indexer
  cancel-in-progress: false

jobs:
  watch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check WatchIndex configuration
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out source
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install -r requirements.txt
      - name: Refresh all authenticated watchlists through RapidIndex
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -m app.watch_indexer
      - name: Report missing credentials
        if: steps.config.outputs.configured != 'true'
        run: echo "::notice::Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as Actions secrets to enable WatchIndex."
