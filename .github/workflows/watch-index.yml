name: WatchIndex shared watchlist refresh
  schedule:
    - cron: '31 */6 * * *'
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
concurrency:
  group: stock-watch-indexer-tidb
  cancel-in-progress: false
jobs:
  watch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run WatchIndex against TiDB watchlists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -m app.watch_indexer
