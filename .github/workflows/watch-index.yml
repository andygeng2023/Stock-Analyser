name: WatchIndex shared watchlist refresh
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/watch-index.yml"
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
concurrency:
  group: stock-watch-indexer-tidb-v2
  cancel-in-progress: true
jobs:
  watch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run WatchIndex against TiDB watchlists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -u -m app.watch_indexer
