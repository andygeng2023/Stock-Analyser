name: Yahoo Finance provider smoke check

on:
  push:
    branches: [main]
    paths:
      - "app/market_data.py"
      - "requirements.txt"
      - ".github/workflows/market-data-provider-smoke.yml"

permissions:
  contents: read

jobs:
  live-provider-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install market data clients
        run: |
          python -m pip install \
            pandas==2.2.3 \
            numpy==2.2.5 \
            yfinance==0.2.61 \
            yahooquery==2.4.1
      - name: Verify both live Yahoo Finance clients
        run: |
          python - <<'PY'
          import math
          import yfinance as yf
          from app.market_data import fetch_history, new_yahooquery_ticker, normalise_history

          # Exercise the production primary/fallback orchestration.
          history, _, metadata = fetch_history(
              "AAPL", period="1y", minimum_rows=100
          )
          assert len(history) >= 100, f"Orchestrator returned only {len(history)} rows"
          assert all(math.isfinite(float(value)) for value in history["Close"]), "Invalid primary/fallback close values"
          print(
              "Orchestrator:",
              metadata["history_provider"],
              len(history),
              "rows; latest daily bar:",
              metadata["latest_history_timestamp"],
          )

          # Exercise yahooquery directly even when yfinance succeeds, so its
          # independent fallback code path is checked against the live endpoint.
          query = new_yahooquery_ticker("AAPL")
          raw = query.history(period="1y", interval="1d", adj_ohlc=True)
          secondary = normalise_history(raw, "AAPL")
          assert len(secondary) >= 100, f"yahooquery returned only {len(secondary)} rows"
          assert all(math.isfinite(float(value)) for value in secondary["Close"]), "Invalid yahooquery close values"
          print(
              "yahooquery:",
              len(secondary),
              "rows; latest daily bar:",
              secondary.index[-1],
          )

          # Verify the primary client can still be instantiated independently.
          assert yf.Ticker("AAPL") is not None
          print("Both live Yahoo Finance retrieval paths returned usable history.")
          PY
