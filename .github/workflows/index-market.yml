name: Incremental market indexing

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# RapidIndex and SlowIndex each have two independent shards.
# Separate concurrency keys allow all four workers to run simultaneously.
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: stock-market-indexer-v2-${{ matrix.indexer }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        indexer: [rapidIndex, SlowIndex]
        shard: [0, 1]
    steps:
      - name: Background indexing paused to protect the D1 daily write allowance
        run: echo "Indexing paused. On-demand analysis remains available."

