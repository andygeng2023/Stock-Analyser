name: Incremental market indexing
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "requirements.txt"
      - "tests/test_worker_config.py"
      - ".github/workflows/index-market.yml"
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
jobs:
  # Retire jobs created by the former two-indexer matrix. Their concurrency
  # groups match the old worker names, so GitHub cancels those runs before
  # the single-index workers below are allowed to start.
  retire-legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        indexer: [rapidIndex, SlowIndex]
        shard: [0, 1]
    concurrency:
      group: stock-market-indexer-tidb-v2-${{ matrix.indexer }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - name: Retire previous indexer generation
        run: echo "Previous indexer generation retired."

  index:
    needs: retire-legacy
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: stock-market-indexer-tidb-v2-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run rapidIndex shard ${{ matrix.shard }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INDEX_SHARD: ${{ matrix.shard }}
        run: python -u -m app.indexer
