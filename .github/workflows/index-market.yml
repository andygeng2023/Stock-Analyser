name: Incremental market indexing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/index-market.yml"
      - "app/worker.py"
      - "app/analyzer.py"
      - "app/scanner.py"
      - "app/indexer.py"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# RapidIndex and SlowIndex each have two independent shards.
# Separate concurrency keys allow all four workers to run simultaneously.
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: stock-market-indexer-${{ matrix.indexer }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        indexer: [rapidIndex, SlowIndex]
        shard: [0, 1]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Incrementally index liquid stocks
        env:
          INDEXER_NAME: ${{ matrix.indexer }}
          CLOUDFLARE_API_URL: https://stock-analyser-api.stock-analyser-2026.workers.dev
          CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          INDEX_SHARD: ${{ matrix.shard }}
          INDEX_PRIORITY_REFRESH_COUNT: ${{ vars.INDEX_PRIORITY_REFRESH_COUNT || '20' }}
          INDEX_REFRESH_AFTER_HOURS: ${{ vars.INDEX_REFRESH_AFTER_HOURS || '6.0' }}
          INDEX_BATCH_SIZE_PER_SHARD: ${{ vars.INDEX_BATCH_SIZE_PER_SHARD || '15' }}
          SLOW_INDEX_BATCH_SIZE_PER_SHARD: ${{ vars.SLOW_INDEX_BATCH_SIZE_PER_SHARD || '2' }}
          SLOW_INDEX_REFRESH_AFTER_HOURS: ${{ vars.SLOW_INDEX_REFRESH_AFTER_HOURS || '168' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -m app.indexer
