name: Incremental market indexing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/index-market.yml"
      - "app/indexer.py"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Two independent shards rotate through the same universe; the primary shard dispatches a successor before the hosted-job ceiling.
concurrency:
  group: stock-market-indexer
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Incrementally index liquid stocks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INDEX_SHARD: ${{ matrix.shard }}
          INDEX_PRIORITY_REFRESH_COUNT: ${{ vars.INDEX_PRIORITY_REFRESH_COUNT || '20' }}
          INDEX_REFRESH_AFTER_HOURS: ${{ vars.INDEX_REFRESH_AFTER_HOURS || '6.0' }}
          INDEX_BATCH_SIZE_PER_SHARD: ${{ vars.INDEX_BATCH_SIZE_PER_SHARD || '15' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -m app.indexer
