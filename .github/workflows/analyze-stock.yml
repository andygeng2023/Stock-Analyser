name: Analyse stock queue

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# All dispatches share one worker lane. GitHub keeps at most one pending
# run for this concurrency group; the database queue holds every real job.
concurrency:
  group: stock-analysis-queue
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Drain the shared Supabase analysis queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m app.worker
