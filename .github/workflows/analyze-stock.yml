name: Analyse stock queue
on:
  schedule:
    # Start a replacement every six hours, leaving a buffer after the
    # 350-minute hosted-runner limit.
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: stock-analysis-queue
  # Never cancel a healthy worker just because another trigger arrives.
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Drain TiDB analysis queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -u -m app.worker
