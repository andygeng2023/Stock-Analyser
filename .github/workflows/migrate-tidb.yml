name: Migrate existing data to TiDB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Copy D1 records into TiDB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          D1_EXPORT_API_URL: https://stock-analyser-api.stock-analyser-2026.workers.dev
        run: python scripts/migrate_d1_to_tidb.py
      - name: Start TiDB-backed workers after migration succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for workflow in analyze-stock.yml index-market.yml scan-market.yml watch-index.yml cleanup-cache.yml; do
            echo "Dispatching $workflow"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}'
          done
