name: Initialise and verify TiDB

on:
  push:
    branches: [main]
    paths:
      - "tidb/schema.sql"
      - "app/db.py"
      - ".github/workflows/migrate-tidb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Apply clean TiDB schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.db import connect
          statements = [s.strip() for s in Path("tidb/schema.sql").read_text().split(";") if s.strip()]
          with connect() as conn, conn.cursor() as cur:
              for statement in statements:
                  cur.execute(statement)
              cur.execute("SELECT 1 AS ok")
              assert cur.fetchone()["ok"] == 1
              cur.execute("""
                SELECT table_name FROM information_schema.tables
                WHERE table_schema = current_schema()
              """)
              found = {row["table_name"] for row in cur.fetchall()}
          expected = {"users", "sessions", "watchlist_items", "analysis_jobs",
                      "market_index", "market_index_catalog", "api_rate_limits"}
          missing = expected - found
          if missing:
              raise SystemExit("Missing TiDB tables: " + ", ".join(sorted(missing)))
          print("TiDB schema applied and verified:", ", ".join(sorted(expected)))
          PY
