name: Deploy Stock Analyser to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/static/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir -p site
          cp app/static/*.html app/static/*.css app/static/*.js site/
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path("site/index.html")
          html = path.read_text(encoding="utf-8")
          for asset in ("style.css", "app.js", "config.js"):
              html = html.replace(f"./{asset}?v=202611", f"./{asset}?v={os.environ['GITHUB_SHA']}")
          path.write_text(html, encoding="utf-8")
          PY
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
