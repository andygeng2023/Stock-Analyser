name: Deploy Stock Analyser to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/static/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site and runtime configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing Supabase configuration. Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY as Actions variables or secrets."
            exit 1
          fi
          mkdir -p site
          cp app/static/index.html app/static/style.css app/static/app.js site/
          python - <<'PY'
          import json, os
          config = {
              "supabaseUrl": os.environ.get("SUPABASE_URL", ""),
              "supabasePublishableKey": os.environ.get("SUPABASE_PUBLISHABLE_KEY", ""),
          }
          with open("site/config.js", "w", encoding="utf-8") as f:
              f.write("window.STOCK_ANALYSER_CONFIG = " + json.dumps(config) + ";\n")
          PY
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
