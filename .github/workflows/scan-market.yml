name: Continuous background market scanning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan-market.yml"
      - "app/worker.py"
      - "app/background_scanner.py"
      - "app/scanner.py"
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: stock-background-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Continuously refresh the shared market scan
        env:
          CLOUDFLARE_API_URL: https://stock-analyser-api.stock-analyser-2026.workers.dev
          CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -m app.background_scanner
