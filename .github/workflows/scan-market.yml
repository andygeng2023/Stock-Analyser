name: Continuous background market scanning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan-market.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: stock-background-scanner-v2
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Background service paused to protect the D1 daily write allowance
        run: echo "Background service paused. On-demand analysis remains available."

