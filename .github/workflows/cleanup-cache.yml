name: Expire shared analysis cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-cache.yml"
      - "app/maintenance.py"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: ${{ vars.STOCK_ANALYSER_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Delete expired shared cache entries
        env:
          STOCK_ANALYSER_API_URL: ${{ vars.STOCK_ANALYSER_API_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: python -m app.maintenance
