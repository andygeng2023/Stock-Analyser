name: Expire shared analysis cache
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-cache.yml", "app/maintenance.py", "app/db.py"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Clean TiDB cache
        env:
          DATABASE_URL: \${{ secrets.DATABASE_URL }}
        run: python -m app.maintenance
