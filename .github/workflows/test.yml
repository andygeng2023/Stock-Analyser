name: Test Stock Analyser

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app tests
      - name: Verify TiDB worker imports
        run: python -c "from app.db import connect, fetch_all, upsert_one; from app.worker import claim_next_job, upsert_market_index; print('TiDB worker imports passed')"
      - name: Run offline input validation tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend and API JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/auth.js
          node --check cloudflare/worker.js
      - name: Verify live database connectivity and application schema
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
        run: python -c "from app.db import verify_database; print('Live database verification passed:', verify_database())"
