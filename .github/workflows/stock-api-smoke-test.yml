name: Stock Analyser API smoke test
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/stock-analyser-api/index.ts"
      - ".github/workflows/stock-api-smoke-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify API database connection and required tables
        env:
          API_URL: https://nlaookgsiqojxejwvdsn.supabase.co/functions/v1/stock-analyser-api/api/health
          API_KEY: sb_publishable_-Ty9nayZpJSDo9YwKVzEdw_dG5bD6Kz
        run: |
          for attempt in $(seq 1 18); do
            status=$(curl --silent --show-error --max-time 20 -o response.json -w '%{http_code}' \
              -H "apikey: $API_KEY" -H "Accept: application/json" "$API_URL" || true)
            echo "Health check attempt $attempt: HTTP $status"
            cat response.json 2>/dev/null || true
            echo
            if [ "$status" = "200" ] && grep -q '"ok":true' response.json; then
              echo "TiDB connection and required schema verified."
              exit 0
            fi
            sleep 5
          done
          echo "API health check did not pass."
          exit 1

      - name: Verify market feed endpoint
        env:
          API_URL: https://nlaookgsiqojxejwvdsn.supabase.co/functions/v1/stock-analyser-api/api/market-feed
          API_KEY: sb_publishable_-Ty9nayZpJSDo9YwKVzEdw_dG5bD6Kz
        run: |
          status=$(curl --silent --show-error --max-time 30 -o market-feed.json -w '%{http_code}' \
            -H "apikey: $API_KEY" -H "Accept: application/json" "$API_URL" || true)
          echo "Market feed: HTTP $status"
          if [ -f market-feed.json ]; then
            python - <<'PY'
          import json
          with open("market-feed.json") as f:
              data = json.load(f)
          print("Response fields:", ", ".join(sorted(data.keys())))
          print("Indexed stocks:", data.get("indexed_count", "not reported"))
          print("Recommended:", len(data.get("recommended", [])))
          print("Trending:", len(data.get("trending", [])))
          PY
          fi
          test "$status" = "200"

      - name: Verify stock detail analysis request
        env:
          API_URL: https://nlaookgsiqojxejwvdsn.supabase.co/functions/v1/stock-analyser-api/api/request-analysis
          API_KEY: sb_publishable_-Ty9nayZpJSDo9YwKVzEdw_dG5bD6Kz
        run: |
          status=$(curl --silent --show-error --max-time 30 -o analysis-request.json -w '%{http_code}' \
            -X POST -H "apikey: $API_KEY" -H "Content-Type: application/json" \
            --data '{"ticker":"AAPL","period":"5y","horizon":30,"save_to_indexer":"previewIndex"}' "$API_URL" || true)
          echo "Analysis request: HTTP $status"
          cat analysis-request.json
          echo
          python - <<'PY'
          import json
          with open("analysis-request.json") as f:
              data = json.load(f)
          assert data.get("id"), f"Missing analysis job id: {data}"
          assert data.get("status") in ("queued", "running", "completed"), data
          print("Analysis job accepted:", data["id"], "status:", data["status"])
          PY
          test "$status" = "200" -o "$status" = "202"

      - name: Verify job status and index availability contracts
        env:
          API_URL: https://nlaookgsiqojxejwvdsn.supabase.co/functions/v1/stock-analyser-api/api
          API_KEY: sb_publishable_-Ty9nayZpJSDo9YwKVzEdw_dG5bD6Kz
        run: |
          JOB_ID=$(python -c "import json; print(json.load(open('analysis-request.json'))['id'])")
          status=$(curl --silent --show-error --max-time 30 -o analysis-status.json -w '%{http_code}' \
            -H "apikey: $API_KEY" -H "Accept: application/json" "$API_URL/analysis-status?id=$JOB_ID")
          echo "Analysis status: HTTP $status"
          python - <<'PY'
          import json
          with open("analysis-status.json") as f:
              data = json.load(f)
          assert data.get("status") in ("queued", "running", "completed", "failed"), data
          assert isinstance(data.get("progress"), (int, float)), data
          assert isinstance(data.get("stage"), str) and data["stage"], data
          print("Job state:", data["status"], "progress:", data["progress"], "stage:", data["stage"])
          PY
          test "$status" = "200"

          status=$(curl --silent --show-error --max-time 30 -o index-availability.json -w '%{http_code}' \
            -H "apikey: $API_KEY" -H "Accept: application/json" "$API_URL/index-availability?ticker=AAPL")
          echo "Index availability: HTTP $status"
          python - <<'PY'
          import json
          with open("index-availability.json") as f:
              data = json.load(f)
          assert isinstance(data.get("indexes"), list), data
          assert isinstance(data.get("available"), list), data
          assert all(item.get("id") in ("previewIndex", "FullIndex") for item in data["indexes"]), data
          print("Available index versions:", data["available"])
          PY
          test "$status" = "200"
