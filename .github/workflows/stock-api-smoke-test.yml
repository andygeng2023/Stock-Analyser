name: Stock Analyser API smoke test
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/stock-analyser-api/index.ts"
      - ".github/workflows/stock-api-smoke-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify API database connection and required tables
        env:
          API_URL: https://nlaookgsiqojxejwvdsn.supabase.co/functions/v1/stock-analyser-api/api/health
          API_KEY: sb_publishable_-Ty9nayZpJSDo9YwKVzEdw_dG5bD6Kz
        run: |
          for attempt in $(seq 1 18); do
            status=$(curl --silent --show-error --max-time 20 -o response.json -w '%{http_code}' \
              -H "apikey: $API_KEY" -H "Accept: application/json" "$API_URL" || true)
            echo "Health check attempt $attempt: HTTP $status"
            cat response.json 2>/dev/null || true
            echo
            if [ "$status" = "200" ] && grep -q '"ok":true' response.json; then
              echo "TiDB connection and required schema verified."
              exit 0
            fi
            sleep 5
          done
          echo "API health check did not pass."
          exit 1

      - name: Verify market feed endpoint
        env:
          API_URL: https://nlaookgsiqojxejwvdsn.supabase.co/functions/v1/stock-analyser-api/api/market-feed
          API_KEY: sb_publishable_-Ty9nayZpJSDo9YwKVzEdw_dG5bD6Kz
        run: |
          status=$(curl --silent --show-error --max-time 30 -o market-feed.json -w '%{http_code}' \
            -H "apikey: $API_KEY" -H "Accept: application/json" "$API_URL" || true)
          echo "Market feed: HTTP $status"
          if [ -f market-feed.json ]; then
            python - <<'PY'
          import json
          with open("market-feed.json") as f:
              data = json.load(f)
          print("Response fields:", ", ".join(sorted(data.keys())))
          print("Indexed stocks:", data.get("indexed_count", "not reported"))
          print("Recommended:", len(data.get("recommended", [])))
          print("Trending:", len(data.get("trending", [])))
          PY
          fi
          test "$status" = "200"
